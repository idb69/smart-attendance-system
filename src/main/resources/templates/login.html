<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Attendance System - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>☁ Smart Attendance System</h1>
    <p>Secure Cloud-Based Attendance Platform</p>

    <div class="alert error" th:if="${param.error}">Invalid email or password.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out successfully.</div>

    <form th:action="@{/perform_login}" method="post">
        <input type="email" name="username" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>New student? <a th:href="@{/register}">Create Account</a></p>
    <hr>
    <small><b>Admin:</b> admin@attendance.com &nbsp; | &nbsp; Password: admin123</small>
</div>
</body>
</html>
